[workspace]
resolver = "3"
members = ["crates/bruma-core", "crates/bruma"]

[workspace.package]
version = "0.7.3"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0301091405/bruma"

[workspace.dependencies]
bruma-core = { path = "crates/bruma-core", version = "0.7.3" }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
